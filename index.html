<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />

  <title>NWUer — Coming Back</title>
  <meta
    name="description"
    content="NWUer is coming back."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(76, 92, 150, 0.20),
          transparent 38%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(120, 70, 120, 0.13),
          transparent 42%
        ),
        #08090b;

      color: #f5f5f3;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      opacity: 0.035;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.6'/%3E%3C/svg%3E");
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 34px 42px;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    .brand {
      color: rgba(255, 255, 255, 0.88);
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #95ffb1;
      box-shadow: 0 0 14px rgba(149, 255, 177, 0.55);
      animation: pulse 2.5s ease-in-out infinite;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .hero {
      max-width: 1100px;
      transform: translateY(-2vh);
    }

    .eyebrow {
      color: rgba(255, 255, 255, 0.42);
      font-size: 13px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      margin-bottom: 25px;

      opacity: 0;
      animation: fadeUp 0.9s 0.1s forwards;
    }

    h1 {
      font-size: clamp(52px, 9vw, 138px);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 580;

      opacity: 0;
      animation: fadeUp 1s 0.25s forwards;
    }

    h1 span {
      display: block;
      color: rgba(255, 255, 255, 0.34);
    }

    .subtitle {
      margin-top: 34px;
      max-width: 520px;

      font-size: clamp(16px, 1.7vw, 21px);
      line-height: 1.55;
      letter-spacing: -0.015em;
      color: rgba(255, 255, 255, 0.55);

      opacity: 0;
      animation: fadeUp 1s 0.45s forwards;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;

      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.30);

      opacity: 0;
      animation: fadeUp 1s 0.65s forwards;
    }

    footer .right {
      text-align: right;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding: 24px;
      }

      header {
        font-size: 11px;
      }

      .hero {
        transform: translateY(-3vh);
      }

      .subtitle {
        max-width: 340px;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      footer .right {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <div class="page">
    <header>
      <div class="brand">NWUer</div>

      <div class="status">
        <span class="dot"></span>
        rebuilding
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Since 2018</div>

        <h1>
          NWUer
          <span>is coming back.</span>
        </h1>

        <p class="subtitle">
          Eight years later, this little corner of the Internet
          is waking up again.
        </p>
      </section>
    </main>

    <footer>
      <div>
        nwuer.org.cn
      </div>

      <div class="right">
        Independent community project<br />
        Not an official NWU website
      </div>
    </footer>
  </div>
</body>
</html>
